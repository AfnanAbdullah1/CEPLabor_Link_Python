services:
  # PostgreSQL Database
  - type: pserv
    name: laborlink-db
    plan: free
    databaseName: laborlink
    databaseUser: laborlink
    region: singapore

  # Backend API Service
  - type: web
    name: laborlink-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: chmod +x ./build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: laborlink-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: CORS_ORIGINS
        sync: false
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: laborlink-frontend
    runtime: static
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: REACT_APP_API_URL
        sync: false
    autoDeploy: true
